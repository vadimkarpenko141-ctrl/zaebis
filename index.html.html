!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка камеры</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            max-width: 400px;
            padding: 30px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #joke {
            display: none;
            font-size: 28px;
        }
    </style>
</head>

<body>

    <div class="box" id="main">
        <h1> хялява в кс2 </h1>
        <p>Нажми кнопку, чтобы забрать халаявый скин в кс 2 
.</p>

        <button onclick="startCamera()">
            нажми!!!
        </button>
    </div>

    <div class="box" id="joke">
        😂
        <br><br>
        <strong>=ебать ты лох!</strong>

        <p>
            Камера не записывалась,
            фотография никуда не отправлялась.
        </p>
    </div>

    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });

                // Останавливаем камеру сразу после получения разрешения
                stream.getTracks().forEach(function(track) {
                    track.stop();
                });

                document.getElementById("main").style.display = "none";
                document.getElementById("joke").style.display = "block";

            } catch (error) {
                document.getElementById("main").innerHTML = `
                    <h2> ну ты ебать тип!</h2>
                    <p>Ты не достоит этого скина .</p>
                `;
            }
        }
    </script>

</body>
</html>
